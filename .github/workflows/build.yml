name: Build RolCards

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package
          elif [ -f "build.gradle" ]; then
            ./gradlew build
          else
            echo "No Maven or Gradle build file found."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RolCards-JAR
          path: |
            **/target/*.jar
            **/build/libs/*.jar
